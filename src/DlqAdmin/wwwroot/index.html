<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DLQ Admin</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #1a1a1a; }
    h1 { margin: 0 0 20px 0; font-size: 22px; }
    .metrics { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .metric-card { border: 1px solid #d0d0d0; border-radius: 6px; padding: 12px 20px; min-width: 140px; background: #fafafa; }
    .metric-card h3 { margin: 0 0 6px 0; font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 0.04em; }
    .metric-card .value { font-size: 28px; font-weight: 700; }
    .queue-selector { margin-bottom: 20px; display: flex; gap: 8px; }
    .queue-selector button { padding: 7px 18px; cursor: pointer; border: 1px solid #aaa; border-radius: 4px; background: #fff; font-size: 14px; }
    .queue-selector button.active { background: #0062cc; color: #fff; border-color: #0062cc; }
    .message-card { border: 1px solid #ddd; border-radius: 6px; padding: 14px 16px; margin-bottom: 10px; background: #fff; }
    .fields { display: flex; flex-wrap: wrap; gap: 6px 24px; margin-bottom: 10px; }
    .field label { font-size: 11px; color: #888; display: block; margin-bottom: 2px; }
    .field span { font-size: 14px; font-weight: 500; }
    .actions { display: flex; gap: 8px; }
    .actions button { padding: 5px 14px; cursor: pointer; border: 1px solid #aaa; border-radius: 4px; background: #fff; font-size: 13px; }
    .actions button.btn-requeue { border-color: #0062cc; color: #0062cc; }
    .actions button.btn-discard { border-color: #c53030; color: #c53030; }
    .payload { background: #f4f4f4; border: 1px solid #ddd; border-radius: 4px; padding: 10px; margin-top: 10px; font-family: monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; display: none; }
    .info { color: #555; font-size: 14px; }
    .error { color: #c53030; font-size: 14px; }
  </style>
</head>
<body>
  <h1>DLQ Admin</h1>

  <div class="metrics">
    <div class="metric-card">
      <h3>Total</h3>
      <div class="value" id="metric-total">–</div>
    </div>
    <div class="metric-card">
      <h3>EntityNotFound</h3>
      <div class="value" id="metric-EntityNotFound">–</div>
    </div>
    <div class="metric-card">
      <h3>InvalidStateTransition</h3>
      <div class="value" id="metric-InvalidStateTransition">–</div>
    </div>
    <div class="metric-card">
      <h3>HydrationFailed</h3>
      <div class="value" id="metric-HydrationFailed">–</div>
    </div>
  </div>

  <div class="queue-selector">
    <button id="btn-onboarding" class="active" onclick="selectQueue('onboarding-deadletter')">onboarding-deadletter</button>
    <button id="btn-amendment" onclick="selectQueue('amendment-deadletter')">amendment-deadletter</button>
  </div>

  <div id="message-list"></div>

  <script>
    var currentQueue = 'onboarding-deadletter';

    function selectQueue(queue) {
      currentQueue = queue;
      document.getElementById('btn-onboarding').className = queue === 'onboarding-deadletter' ? 'active' : '';
      document.getElementById('btn-amendment').className  = queue === 'amendment-deadletter'  ? 'active' : '';
      loadMessages();
    }

    async function loadMessages() {
      var list = document.getElementById('message-list');
      list.innerHTML = '<p class="info">Loading…</p>';
      try {
        var response = await fetch('/api/dlq/' + currentQueue);
        if (!response.ok) {
          list.innerHTML = '<p class="error">Failed to load messages (HTTP ' + response.status + ').</p>';
          return;
        }
        var messages = await response.json();
        renderMetrics(messages);
        renderMessages(messages);
      } catch (e) {
        list.innerHTML = '<p class="error">Error: ' + e.message + '</p>';
      }
    }

    function renderMetrics(messages) {
      document.getElementById('metric-total').textContent = messages.length;
      var reasons = ['EntityNotFound', 'InvalidStateTransition', 'HydrationFailed'];
      for (var i = 0; i < reasons.length; i++) {
        var reason = reasons[i];
        var count = messages.filter(function(m) { return m.reason === reason; }).length;
        document.getElementById('metric-' + reason).textContent = count;
      }
    }

    function renderMessages(messages) {
      var list = document.getElementById('message-list');
      if (messages.length === 0) {
        list.innerHTML = '<p class="info">No messages in queue.</p>';
        return;
      }
      var html = '';
      for (var i = 0; i < messages.length; i++) {
        var m = messages[i];
        var deadLetteredAt = m.deadLetteredAt ? new Date(m.deadLetteredAt).toLocaleString() : '–';
        html += '<div class="message-card" id="card-' + esc(m.messageId) + '">' +
          '<div class="fields">' +
            '<div class="field"><label>partyId</label><span>'     + esc(m.partyId    ?? '–') + '</span></div>' +
            '<div class="field"><label>topic</label><span>'      + esc(m.topic      ?? '–') + '</span></div>' +
            '<div class="field"><label>partition</label><span>'  + esc(String(m.partition ?? '–')) + '</span></div>' +
            '<div class="field"><label>offset</label><span>'     + esc(String(m.offset     ?? '–')) + '</span></div>' +
            '<div class="field"><label>reason</label><span>'     + esc(m.reason     ?? '–') + '</span></div>' +
            '<div class="field"><label>attempts</label><span>'   + esc(String(m.attempts   ?? '–')) + '</span></div>' +
            '<div class="field"><label>deadLetteredAt</label><span>' + esc(deadLetteredAt) + '</span></div>' +
          '</div>' +
          '<div class="actions">' +
            '<button onclick="togglePayload(\'' + esc(m.messageId) + '\')">Expand</button>' +
            '<button class="btn-requeue" onclick="requeueMessage(\'' + esc(m.messageId) + '\')">Requeue</button>' +
            '<button class="btn-discard" onclick="discardMessage(\'' + esc(m.messageId) + '\')">Discard</button>' +
          '</div>' +
          '<pre class="payload" id="payload-' + esc(m.messageId) + '">' + esc(m.body ?? '') + '</pre>' +
        '</div>';
      }
      list.innerHTML = html;
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function togglePayload(messageId) {
      var el = document.getElementById('payload-' + messageId);
      el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    async function requeueMessage(messageId) {
      if (!confirm('Requeue message ' + messageId + '?')) return;
      try {
        var response = await fetch('/api/dlq/' + currentQueue + '/requeue/' + encodeURIComponent(messageId), { method: 'POST' });
        if (response.ok) {
          loadMessages();
        } else {
          alert('Requeue failed: HTTP ' + response.status);
        }
      } catch (e) {
        alert('Requeue error: ' + e.message);
      }
    }

    async function discardMessage(messageId) {
      if (!confirm('Discard message ' + messageId + '?')) return;
      try {
        var response = await fetch('/api/dlq/' + currentQueue + '/' + encodeURIComponent(messageId), { method: 'DELETE' });
        if (response.ok) {
          loadMessages();
        } else {
          alert('Discard failed: HTTP ' + response.status);
        }
      } catch (e) {
        alert('Discard error: ' + e.message);
      }
    }

    loadMessages();
  </script>
</body>
</html>
